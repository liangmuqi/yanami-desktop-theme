<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八奈见 · 白 / 墨主题演示</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#354052;font:14px system-ui,sans-serif}aside{position:fixed;left:0;top:0;bottom:0;width:254px;border-right:1px solid #edf0f2;padding:28px 22px;background:#fdfdfd}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;border-radius:8px;padding:10px}aside>button{font-size:24px;color:#182434;padding:0;margin:0 0 30px}.nav{padding:14px 6px;font-size:13px}.muted{color:#8c97a5;font-size:11px}.recent{background:#f0f4f8;border-radius:8px;padding:13px 10px;margin-top:12px}.footer{position:absolute;bottom:25px;left:27px;font-size:12px}header{position:fixed;top:0;left:254px;right:0;height:65px;border-bottom:1px solid #f2f3f6;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:12px;background:#fff;z-index:1}header button{font-size:11px;padding:6px}main{position:absolute;left:254px;right:0;top:65px;height:calc(100vh - 65px);box-sizing:border-box;padding-top:260px}.thread-body-max-width{width:740px;margin:auto}.composer-surface-chrome{height:164px;border:1px solid #dfe5ec;border-radius:18px;padding:22px;box-shadow:0 8px 28px #12345605}.composer-surface-chrome textarea{border:0;outline:none;resize:none;width:100%;height:75px;background:transparent;font:13px system-ui;color:#576477}.composer-footer{font-size:11px;color:#8793a3;display:flex;justify-content:space-between;align-items:center}.send{background:#3d4652;color:white;border-radius:50%;width:30px;height:30px;text-align:center;padding:4px}.demo-badge{position:fixed;left:282px;bottom:18px;color:#9aa6b4;font-size:10px;z-index:2}</style>
<aside class="app-shell-left-panel"><button id="brand" aria-label="当前模式: Codex">Codex</button><div class="nav">＋　新建聊天</div><div class="nav">⌕　搜索聊天</div><div class="nav">▱　项目</div><div class="nav muted">　我的工作区</div><div class="muted" style="margin:40px 2px 0">最近聊天</div><div class="recent">·　新的开始</div><div class="footer">八奈见 · 白 / 墨<br><span class="muted">LOCAL THEME DEMO</span></div></aside>
<header class="app-header-tint"><span>新聊天</span><div><button id="white">白</button><button id="ink">墨</button><button id="product">切换产品标识</button></div></header>
<main class="_MainContentSurface_demo"><h1 style="text-align:center;font-weight:400">从一个想法开始。</h1><div class="thread-body-max-width"><div class="composer-surface-chrome"><textarea placeholder="描述任务，或提出一个想法…"></textarea><div class="composer-footer"><span>＋　Codex　⌄　│　▱ 我的工作区</span><span class="send">↑</span></div></div></div></main><div class="demo-badge">本地演示 · 不连接真实账户 · 气泡数值为演示数据</div>
<script>
const params=new URLSearchParams(location.search),theme=params.get('theme')==='white'?'white':'ink';
localStorage.setItem('yanami-native-theme-v1',JSON.stringify({theme,art:theme==='white'?'cutout':'profile',whiteArt:'cutout',inkArt:'profile',show:true,strength:100,breath:true,product:'auto'}));
if(params.has('nointro'))localStorage.setItem('yanami-native-last-startup','preview-session');else localStorage.removeItem('yanami-native-last-startup');
window.__yanamiRequestAsset=id=>fetch('/asset/'+encodeURIComponent(id)).then(r=>r.json()).then(a=>window.__yanamiNative?.receiveAsset(id,a.src));
window.__yanamiRequestUsage=raw=>{const r=JSON.parse(raw);window.__yanamiNative?.receiveUsage(r.id,{updatedAt:Date.now(),groups:[{name:'演示数据',windows:[{id:'primary',remaining:72,minutes:300,resetsAt:Math.floor(Date.now()/1000)+3600}]}]});};
document.getElementById('white').onclick=()=>window.__yanamiNative?.setTheme('white');document.getElementById('ink').onclick=()=>window.__yanamiNative?.setTheme('ink');document.getElementById('product').onclick=()=>{const b=document.getElementById('brand');b.textContent=b.textContent==='Codex'?'ChatGPT':'Codex';b.setAttribute('aria-label','当前模式: '+b.textContent);};
const script=document.createElement('script');script.src='/payload.js?theme='+theme;document.body.append(script);
</script></html>
